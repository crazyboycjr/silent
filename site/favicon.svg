<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="32" height="32" viewBox="0 0 32 32">
  <title>silent</title>
  <!-- silent's icon drawn for 16 to 32 px (favicon, panels, menus): the hood,
       the horns and the arm on the lifted night ground, two rims of acid
       light, two large eyes, and a one-pixel moonlit edge at 32 px. -->
  <defs>
    <clipPath id="tile"><rect width="32" height="32" rx="7" ry="7"/></clipPath>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262d59"/>
      <stop offset="1" stop-color="#11152d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".9"/></filter>
    <path id="horn" d="M12.6 9.2C11.6 7 10.6 4.7 9.3 2.2C11.2 3.8 13 5.7 15 7.6Z"/>
  </defs>
  <rect width="32" height="32" rx="7" ry="7" fill="url(#night)"/>
  <g clip-path="url(#tile)">
    <use xlink:href="#horn" fill="#5a4130"/>
    <use xlink:href="#horn" fill="#5a4130" transform="translate(32 0) scale(-1 1)"/>
    <path d="M5.1 33.4C5.1 24.9 7.2 17.4 10.4 12.2C12.4 9.1 14.2 6.5 16 3.7C17.8 6.5 19.6 9.1 21.6 12.2C24.8 17.4 26.9 24.9 26.9 33.4Z" fill="#16261a"/>
    <path d="M16 8.5C18.5 10.6 20.5 13.8 20.5 17.7C20.5 21.4 18.6 23.9 16 24.5C13.4 23.9 11.5 21.4 11.5 17.7C11.5 13.8 13.5 10.6 16 8.5Z" fill="#070a08"/>
    <path d="M-1.6 23.3C5 21.2 13.2 19.5 21 18.8C23.4 18.6 25.2 19.4 25.2 21C25.3 22.6 23.8 23.6 21.8 23.8C14.4 24.6 6.6 26.4 -1.6 29.5Z" fill="#1a2e1c"/>
    <g fill="none" stroke="#c6f544" stroke-width="1.2" stroke-linecap="round">
      <path d="M16 3.7C14.2 6.5 12.4 9.1 10.4 12.2C7.2 17.4 5.1 24.9 5.1 33.4"/>
      <path d="M-1.6 23.3C5 21.2 13.2 19.5 21 18.8C23.4 18.6 25.2 19.4 25.2 21"/>
    </g>
    <g fill="#b8f02e" filter="url(#glow)">
