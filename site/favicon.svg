      <ellipse cx="17.9" cy="14.6" rx="1.9" ry="1.1"/>
    </g>
    <g fill="#eaff96">
      <ellipse cx="14.1" cy="14.6" rx="1.5" ry=".8"/>
      <ellipse cx="17.9" cy="14.6" rx="1.5" ry=".8"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="31" height="31" rx="6.5" ry="6.5" fill="none" stroke="#b4bcf0" stroke-opacity=".38"/>
</svg>
