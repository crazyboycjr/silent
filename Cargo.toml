[package]
name = "silent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A borderless, fast file previewer for Nautilus (a sushi replacement)"
publish = false

[dependencies]
async-channel = "2.5"
async-io = "2.6"
fast_image_resize = "6.1"
futures-lite = "2.6"
gio = "0.22"
glycin = "4.0"
gpui-kit = { version = "0.8", default-features = false }
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"
smallvec = "1"
x11rb = { version = "0.14", features = ["randr"] }
zbus = { version = "5.15", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
