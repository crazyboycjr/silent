[package]
name = "silent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A borderless, fast file previewer for Nautilus (a sushi replacement)"
license = "Apache-2.0"
publish = false

[dependencies]
async-channel = "2.5"
async-io = "2.6"
base64 = "0.22"
calamine = "0.37"
compress-tools = "0.16"
encoding_rs = "0.8"
fast_image_resize = { version = "6.1", features = ["rayon"] }
futures-lite = "2.6"
gio = "0.22"
glycin = "4.0"
gpui-kit = { version = "0.8", default-features = false, features = [
    "component",
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
gpui-kit-assets = "=0.8.0"
gpui-pdf = "0.6.1"
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.9" }
gpui-video-player = { version = "0.1.3", default-features = false, features = ["gpui-pre"] }
gstreamer = "0.25"
hayro = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kurbo = "0.13"
libc = "0.2"
lofty = "0.25"
log = "0.4"
markdown = "1.0"
memmap2 = "0.9"
moxcms = { version = "0.8", features = ["in_place"] }
percent-encoding = "2.3"
raw-window-handle = "0.6"
ropey = "=2.0.0-beta.1"
roxmltree = "0.21"
smallvec = "1"
tree-sitter = "0.26"
unicode-width = "0.2"
url = "2"
x11rb = { version = "0.14", features = ["randr"] }
zune-core = "0.5"
zune-jpeg = "0.5"
yuv = "0.8"
zbus = { version = "5.15", default-features = false, features = ["async-io", "blocking-api"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# gpui's X11 and wgpu backends, with silent's start-up marks and switches.
# vendor/README.md says what differs from the published crates.
[patch.crates-io]
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
