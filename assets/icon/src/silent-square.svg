    </g>
  </defs>
  <rect width="1024" height="1024" fill="url(#night)"/>
  <g transform="translate(512 512) scale(1.14) translate(-512 -512)">
    <path d="M900 180A330 330 0 1 1 610 700A290 290 0 1 0 900 180Z" fill="#232b58" opacity=".8"/>
