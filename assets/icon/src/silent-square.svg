    <path d="M232 960C232 740 286 548 368 414C418 334 466 266 512 196C558 266 606 334 656 414C738 548 792 740 792 960Z" fill="#132017"/>
    <path d="M512 318C576 372 628 456 628 556C628 650 578 716 512 730C446 716 396 650 396 556C396 456 448 372 512 318Z" fill="#070a08"/>
    <path d="M60 700C230 646 440 602 640 584C702 578 748 600 750 640C752 682 714 708 660 714C470 734 270 780 60 860Z" fill="#17291a"/>
